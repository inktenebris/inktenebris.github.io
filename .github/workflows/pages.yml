name: Build and deploy INKTENEBRIS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free build dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate website and PDFs
        run: python tools/build.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Validate generated website
        run: python tools/validate.py
      - name: Package public website
        run: python tools/package_site.py
      - name: Check dotfiles are in the package
        run: test -s dist/.well-known/security.txt
      # Built by hand (instead of upload-pages-artifact) so hidden folders such as .well-known are kept.
      - name: Create Pages archive
        run: tar --dereference --hard-dereference --directory dist -cf "$RUNNER_TEMP/artifact.tar" .
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
