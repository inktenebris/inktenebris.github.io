<!doctype html>
<html lang="{{ site.language }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="{{ site.theme_color }}" />
    <title>{{ error.title }} | {{ site.site_name }}</title>
    <link rel="stylesheet" href="{{ base }}assets/style.css" />
    <link rel="icon" href="{{ base }}images/favicon.ico" />
  </head>

  <body>
    <main>
      <section
        style="
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          text-align: center;
          padding: 24px;
        "
      >
        <h1 style="font-size: 15vw; line-height: 1; margin: 0">
          {{ error.code }}
        </h1>
        <p style="margin-top: 20px; opacity: 0.6">{{ error_message }}</p>
        <a
          href="{{ base }}index.html"
          style="margin-top: 40px; border: 1px solid white; padding: 15px 30px"
          >{{ error.button }}</a
        >
      </section>
    </main>
  </body>
</html>
